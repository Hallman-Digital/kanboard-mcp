name: Build Hallman Actions plugin

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Actions plugin release tag (example: actions-v0.3.1)"
        required: true
        default: "actions-v0.3.1"
  push:
    tags:
      - "actions-v*"

permissions:
  contents: write

jobs:
  build-actions-plugin:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
      - name: Validate plugin source
        shell: bash
        run: |
          set -euo pipefail
          test -f plugins/HallmanActionsMenu/Plugin.php
          test -f plugins/HallmanActionsMenu/Assets/js/actions-menu.js
          test -f plugins/HallmanActionsMenu/Assets/css/actions-menu.css
          php -l plugins/HallmanActionsMenu/Plugin.php
      - name: Package installable plugin
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist
          cd plugins
          zip -X -qr ../dist/HallmanActionsMenu.zip HallmanActionsMenu
          cd ..
          unzip -t dist/HallmanActionsMenu.zip
          python3 - <<'PY'
          import zipfile
          with zipfile.ZipFile('dist/HallmanActionsMenu.zip') as z:
              names = z.namelist()
              assert names and names[0].startswith('HallmanActionsMenu/')
              assert 'HallmanActionsMenu/Plugin.php' in names
              assert 'HallmanActionsMenu/Assets/js/actions-menu.js' in names
              assert 'HallmanActionsMenu/Assets/css/actions-menu.css' in names
              assert z.testzip() is None
          PY
      - name: Upload installable ZIP
        uses: actions/upload-artifact@v4
        with:
          name: HallmanActionsMenu-installable
          path: dist/HallmanActionsMenu.zip
          if-no-files-found: error
      - name: Publish explicit Actions plugin release
        if: github.ref_type == 'tag' || inputs.release_tag != ''
        env:
          GH_TOKEN: ${{ github.token }}
          INPUT_TAG: ${{ inputs.release_tag || 'actions-v0.3.1' }}
          GITHUB_REF_TYPE: ${{ github.ref_type }}
          GITHUB_REF_NAME: ${{ github.ref_name }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ "$GITHUB_REF_TYPE" == "tag" ]]; then TAG="$GITHUB_REF_NAME"; else TAG="$INPUT_TAG"; fi
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" dist/HallmanActionsMenu.zip --clobber
          else
            gh release create "$TAG" dist/HallmanActionsMenu.zip --target "$GITHUB_SHA" --title "Hallman Actions Menu $TAG" --notes "Installable HallmanActionsMenu plugin package."
          fi
