name: Package Kanboard plugin

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Build Kanboard-compatible ZIP
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist/ModelContextProtocol
          tar --exclude=.git --exclude=.github --exclude=dist --exclude=themes --exclude='*.zip' -cf - . | tar -xf - -C dist/ModelContextProtocol
          cd dist
          zip -qr ModelContextProtocol.zip ModelContextProtocol
          unzip -l ModelContextProtocol.zip | head -30

      - name: Upload installable package
        uses: actions/upload-artifact@v4
        with:
          name: ModelContextProtocol
          path: dist/ModelContextProtocol.zip
          if-no-files-found: error
